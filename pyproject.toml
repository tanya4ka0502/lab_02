[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Streaming log statistics from CSV and JSONL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
]

[project.scripts]
streamstats = "streamstats.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"